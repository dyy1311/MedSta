[project]
name = "medsta"
version = "0.1.0"
description = "轻量级 AI 赋能数据统计分析/预测/绘图及解释智能体（Web 端）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "Agently>=4.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_llm: 需要真实模型 API（设置 MEDSTA_REAL_LLM=1 才运行，默认跳过）",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# UP042 (str,Enum -> StrEnum) 属 unsafe fix：本仓库依赖 str(Enum) 的 f-string
# 语义（成员名），StrEnum 会改为 value——运行时行为变化，禁用
ignore = ["UP042"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
